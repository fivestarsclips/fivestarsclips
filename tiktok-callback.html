<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>fivestarsclips – finish connecting</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0a1a; color: #eee; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    main { max-width: 640px; padding: 24px; }
    h1 { font-size: 22px; }
    textarea { width: 100%; height: 120px; background: #1d1530; color: #fff; border: 1px solid #4b3a6b; border-radius: 8px; padding: 10px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 12px; background: #ff2d75; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
    p { color: #bbb; }
    .err { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <h1>Almost done</h1>
    <p id="msg">Copy this address and paste it into ClipForge → Accounts → TikTok → <b>Finish</b>.</p>
    <textarea id="url" readonly></textarea>
    <button id="copy">Copy</button>
    <p>This page doesn't send or store anything — the code only works together with your ClipForge app.</p>
  </main>
  <script>
    const url = window.location.href;
    document.getElementById("url").value = url;
    const q = new URLSearchParams(window.location.search);
    if (!q.get("code")) {
      const m = document.getElementById("msg");
      m.className = "err";
      m.textContent = q.get("error_description") || q.get("error") || "No authorisation code in this address — start the connection again in ClipForge.";
    }
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(url); } catch (e) { document.getElementById("url").select(); document.execCommand("copy"); }
      document.getElementById("copy").textContent = "Copied ✓";
    };
  </script>
</body>
</html>
